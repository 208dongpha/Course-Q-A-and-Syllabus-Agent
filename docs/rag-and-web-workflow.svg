<text x="622" y="909" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Class answer</text>
<text x="622" y="933.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#374151">strong score or roadmap</text>
