<rect x="30" y="1280" width="930" height="75" fill="#ffffff" stroke="#111827" stroke-width="1.4"/>
<text x="42" y="1309" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Generate grounded answer and stream it</text>
<text x="42" y="1334.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#374151">citations, suggestions, history, feedback</text>
<text x="30" y="1390" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#374151">Low or empty class evidence continues through routing; web search is conditional and no-evidence is an explicit response.</text>
